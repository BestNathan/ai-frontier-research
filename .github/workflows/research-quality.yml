name: Research Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test source-watch parser and filtering
        run: python3 -m unittest discover -s scripts -p 'test_claude_resources_watch.py'
      - name: Validate research files and internal links
        run: python3 scripts/check_research.py
